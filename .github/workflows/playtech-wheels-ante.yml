name: Playtech FUN Wheels of Olympus Ante probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['remote/playtech-wheels-ante-trigger.json']
permissions:
  contents: read
jobs:
  check-ante:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYTECH_OUT: /tmp/playtech-ante-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and OCR
        run: |
          python -m pip install -e . pillow pytesseract
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Validate the guarded probe
        run: python -m py_compile remote/playtech_wheels_ante_probe.py
      - name: One DEMO toggle and at most one spin if visually verified
        run: python -u remote/playtech_wheels_ante_probe.py
      - name: Archive redacted protocol metadata and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtech-wheels-ante-${{ github.run_id }}
          path: /tmp/playtech-ante-evidence/
          retention-days: 7
          if-no-files-found: warn
