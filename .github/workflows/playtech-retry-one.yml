name: Playtech FUN single-game retry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['remote/playtech-retry-one.json']
permissions:
  contents: write
jobs:
  single-game:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      PLAYTECH_ONLY: gpas_aogggriffin_pop
      PLAYTECH_OUT: /tmp/playtech-bonus-evidence
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and OCR
        run: |
          python -m pip install -e . pillow pytesseract
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Check runner code
        run: python -m py_compile remote/playtech_autopilot.py
      - name: Resume bounded FUN game exploration
        run: python -u remote/playtech_autopilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtech-fun-griffin-retry-${{ github.run_id }}
          path: /tmp/playtech-bonus-evidence/
          retention-days: 7
          if-no-files-found: warn
