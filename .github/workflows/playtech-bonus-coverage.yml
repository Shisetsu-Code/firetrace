name: Playtech FUN feature coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['remote/playtech-bonus-batch.json']
permissions:
  contents: write
jobs:
  feature-explorer:
    concurrency:
      group: playtech-feature-${{ github.ref }}-${{ matrix.group }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    env:
      PLAYTECH_GROUP: ${{ matrix.group }}
      PLAYTECH_GROUPS: '4'
      PLAYTECH_OUT: ${{ runner.temp }}/playtech-bonus-evidence
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and OCR
        run: |
          python -m pip install -e . pillow pytesseract pytest
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Syntax check
        run: python -m py_compile remote/playtech_autopilot.py
      - name: Probe native autoplay and identify FUN feature transitions
        run: python -u remote/playtech_autopilot.py
      - name: Persist sanitized per-game observations, screenshots and protocol metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtech-bonus-group-${{ matrix.group }}-${{ github.run_id }}
          path: ${{ runner.temp }}/playtech-bonus-evidence/
          retention-days: 7
          if-no-files-found: warn
