name: MCP
on:
  push:
    paths: ['cloudflare/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/mcp.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
