name: ci

on:
  push:
    paths-ignore:
      - "commands/**"
      - "Firetrace-Worker.exe"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FIRETRACE_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - run: python -m compileall -q firetrace
