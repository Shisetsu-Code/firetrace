name: Wonder Warriors FUN branch coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['remote/wonder-branches.json']
permissions:
  contents: write
jobs:
  branches:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      PLAYTECH_OUT: /tmp/wonder-evidence
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VARIANT_SECONDS: '5600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and text detector
        run: |
          python -m pip install -e . pillow pytesseract
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Check script syntax
        run: python -m py_compile remote/wonder_warriors_branches.py remote/playtech_autopilot.py
      - name: Run two independently isolated reel features
        run: python -u remote/wonder_warriors_branches.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonder-warriors-branches-${{ github.run_id }}
          path: /tmp/wonder-evidence/
          retention-days: 7
          if-no-files-found: warn
