name: Playtech FUN targeted recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['remote/playtech-recovery.json']
permissions:
  contents: write
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        game: [gpas_agstorm3_pop, gpas_mgaogkol_pop]
    env:
      PLAYTECH_ONLY: ${{ matrix.game }}
      PLAYTECH_OUT: /tmp/playtech-bonus-evidence
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install -e . pillow pytesseract
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Verify executable source
        run: python -m py_compile remote/playtech_autopilot.py
      - name: Resume FUN game feature exploration
        run: python -u remote/playtech_autopilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.game }}-${{ github.run_id }}
          path: /tmp/playtech-bonus-evidence/
          retention-days: 7
          if-no-files-found: warn
