name: Playtech FUN Rulers autoplay modal recovery
on:
  push:
    branches: [main]
    paths: ['remote/playtech-rulers-autoplay-trigger.json']
permissions:
  contents: write
jobs:
  resume-rulers-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PLAYTECH_ONLY: aogroo
      PLAYTECH_OUT: /tmp/playtech-rulers-recovery
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and OCR
        run: |
          python -m pip install -e . pillow pytesseract
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Validate new modal detection in FUN runner
        run: python -m py_compile remote/playtech_autopilot.py
      - name: Verify Rulers autoplay repeat in isolated DEMO (no purchases)
        run: python -u remote/playtech_autopilot.py
      - name: Preserve progress, screenshots, sanitized endpoints and protocol events
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtech-rulers-autoplay-${{ github.run_id }}
          path: /tmp/playtech-rulers-recovery/
          retention-days: 7
          if-no-files-found: warn
