[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "firetrace"
version = "0.1.0"
description = "Local Firecrawl/CDP browser worker for deterministic endpoint capture"
requires-python = ">=3.11"

[project.scripts]
firetrace = "firetrace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
