[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "firetrace"
version = "0.3.0"
description = "Local browser/CDP worker for deterministic endpoint capture"
requires-python = ">=3.11"
dependencies = ["playwright>=1.55", "websockets>=15,<16"]

[project.scripts]
firetrace = "firetrace.cli:main"
firetrace-gui = "firetrace.gui:main"

[tool.setuptools]
packages = ["firetrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
