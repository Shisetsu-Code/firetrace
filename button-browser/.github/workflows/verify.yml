name: Verify Button Browser
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      commands_file:
        description: Optional commands JSON file in this repository
        required: false
        default: ''
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Run explicit command list
        if: github.event_name == 'workflow_dispatch' && inputs.commands_file != ''
        env:
          COMMANDS_FILE: ${{ inputs.commands_file }}
        run: node scripts/batch.cjs "$COMMANDS_FILE" > command-results.jsonl
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.commands_file != ''
        with:
          name: button-browser-output
          path: |
            data/observations
            command-results.jsonl
          retention-days: 3
